<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1930 Saathi: officer login</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%2337352f%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2211%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3E1930%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">1930</div>1930 Saathi<small>Officer login</small></div>
  <nav class="links"><a href="/">Overview</a><a href="/caller.html">Caller</a><a href="/console.html">Officer console</a></nav>
  
</header>

<main class="narrow">
  <h1>Log in</h1>
  <p class="muted" style="margin:0 0 20px">Officer console for the 1930 Saathi prototype.</p>
  <form id="f">
    <input class="field" id="u" placeholder="Username" autocomplete="username" required>
    <input class="field" id="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Log in</button>
    <div class="muted" id="msg" style="font-size:13px">First run: the server prints the admin password in its terminal.</div>
  </form>
</main>
<script src="/js/common.js"></script>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  try {
    await api('/api/login', { username: document.getElementById('u').value, password: document.getElementById('p').value });
    location.href = new URLSearchParams(location.search).get('next') || '/console.html';
  } catch (err) { document.getElementById('msg').textContent = err.message; }
};
</script>
</body>
</html>
